<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>한림대 통학 마스터</title>
    <!-- 요즘 가장 많이 쓰는 폰트인 'Pretendard' 적용 -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    <style>
        :root {
            --primary-color: #005AAB; 
            --bg-color: #F5F7FA;
        }
        body {
            font-family: 'Pretendard', sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
            color: #333;
        }
        .container {
            max-width: 480px;
            margin: 0 auto;
            padding: 20px;
        }
        .header {
            text-align: center;
            padding: 40px 0 20px 0;
        }
        .header h1 {
            font-size: 28px;
            font-weight: 800;
            color: var(--primary-color);
            margin: 0;
            letter-spacing: -0.5px;
        }
        .header p {
            font-size: 15px;
            color: #666;
            margin-top: 8px;
        }
        .search-box {
            background: white;
            padding: 24px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.03);
            margin-bottom: 20px;
        }
        select {
            width: 100%;
            padding: 16px;
            border: 1.5px solid #E2E8F0;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 500;
            outline: none;
            font-family: inherit;
            margin-bottom: 16px;
            appearance: none; 
            background: url('data:image/svg+xml;utf8,<svg fill="%23999" height="24" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg"><path d="M7 10l5 5 5-5z"/><path d="M0 0h24v24H0z" fill="none"/></svg>') no-repeat right 10px center;
            background-color: white;
        }
        select:focus {
            border-color: var(--primary-color);
        }
        button {
            width: 100%;
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 18px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }
        button:hover {
            background-color: #004585;
        }
        button:active {
            transform: scale(0.98);
        }
        .result-card {
            background: white;
            padding: 24px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.03);
            margin-bottom: 16px;
        }
        .station-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid #EDF2F7;
        }
        .station-name {
            font-size: 18px;
            font-weight: 800;
            color: #1A202C;
        }
        .walk-time {
            font-size: 14px;
            color: #005AAB;
            font-weight: 600;
        }
        .bus-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .bus-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .bus-number {
            font-size: 16px;
            font-weight: 800;
            color: #2D3748;
            background: #EDF2F7;
            padding: 6px 12px;
            border-radius: 8px;
        }
        .bus-time {
            color: #E53E3E;
            font-weight: 800;
            font-size: 16px;
        }
        .loading {
            text-align: center;
            display: none;
            padding: 30px;
            color: #718096;
            font-weight: 600;
        }
    </style>
    <script src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=gthv6ddfee"></script>
</head>
<body>
    <div class="container">
        <!-- 메인 타이틀 영역 -->
        <div class="header">
            <h1>🚌 통학 마스터</h1>
            <p>지금 내 건물에서 가장 빨리 타는 버스</p>
        </div>

        <!-- 검색 및 GPS 영역 -->
        <div class="search-box">
            <!-- 1. 메인 버튼: 내 현재 위치로 가장 빠른 길 찾기 -->
            <button onclick="findRoutesByGPS()" style="background-color: #03c75a; font-size: 18px; margin-bottom: 20px;">
                📍 내 실시간 위치로 주변 버스 찾기
            </button>
            
            <!-- 2. 네이버 지도가 그려질 도화지 -->
            <div id="map" style="width:100%; height:250px; border-radius: 12px; margin-bottom: 20px;"></div>

            <!-- 3. 보조 수단: GPS 안될 때 수동 선택 -->
            <div style="padding-top: 15px; border-top: 1px solid #eee;">
                <p style="font-size: 13px; color: #888; margin-bottom: 8px;">위치 허용이 안 되시나요?</p>
                <select id="building-select" style="margin-bottom: 10px;">
                    <option value="">현재 있는 건물을 직접 선택하세요</option>
                    {% for name in buildings %}
                    <option value="{{ name }}">{{ name }}</option>
                    {% endfor %}
                </select>
                <button onclick="findRoutes()" style="background-color: #2D3748;">선택한 건물로 버스 찾기</button>
            </div>
        </div>

        <!-- 로딩 애니메이션 텍스트 -->
        <div id="loading" class="loading">
            실시간 버스 정보를 불러오는 중입니다... 🏃‍♂️
        </div>

        <!-- 결과가 출력될 공간 -->
        <div id="result-container"></div>
    </div>

    <script>
        let currentLat = null;
        let currentLon = null;
        let map;
        let marker;
        let watchId;
        let firstFixDone = false; // 첫 위치를 받았는지 (지도 이동/핀 애니메이션을 한 번만 하기 위함)

        window.onload = function() {
            // 초기 지도 설정 (한림대 중심)
            const defaultLat = 37.8863; 
            const defaultLon = 127.7381;

            map = new naver.maps.Map('map', {
                center: new naver.maps.LatLng(defaultLat, defaultLon),
                zoom: 16
            });

            marker = new naver.maps.Marker({
                position: new naver.maps.LatLng(defaultLat, defaultLon),
                map: map
            });

            // 사이트 열자마자 위치 추적 시작
            findMyLocation();
        };

        // 실시간 위치 추적 함수
        function findMyLocation() {
            if (!navigator.geolocation) return;

            watchId = navigator.geolocation.watchPosition(function(position) {
                currentLat = position.coords.latitude;
                currentLon = position.coords.longitude;

                const newLocation = new naver.maps.LatLng(currentLat, currentLon);
                marker.setPosition(newLocation);

                // 첫 위치를 받았을 때만 지도를 이동시키고 핀을 한 번 튀게 함
                // (이후에는 사용자가 지도를 자유롭게 움직일 수 있음)
                if (!firstFixDone) {
                    firstFixDone = true;
                    map.panTo(newLocation);
                    marker.setAnimation(naver.maps.Animation.BOUNCE);
                    setTimeout(() => marker.setAnimation(null), 1500);
                }
            }, function(error) {
                console.log('watchPosition error', error.code, error.message);
            }, {
                enableHighAccuracy: false,
                maximumAge: 10000,
                timeout: 15000
            });
        }

        // 서버에 버스 정보 요청 (GPS 검색에서 공통 사용)
        function requestRoutesByCoords(lat, lon) {
            const loading = document.getElementById('loading');
            loading.style.display = 'block';
            loading.innerText = '🚌 버스 도착 시간을 계산하고 있습니다...';
            document.getElementById('result-container').innerHTML = '';

            fetch('/get_route_info', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ lat: lat, lon: lon })
            })
            .then(r => r.json())
            .then(renderResults)
            .catch(() => {
                loading.style.display = 'none';
                alert('데이터 통신에 실패했습니다.');
            });
        }

        // GPS 기반 검색 함수
        function findRoutesByGPS() {
            const loading = document.getElementById('loading');
            loading.style.display = 'block';

            // 이미 watchPosition으로 받아둔 좌표가 있으면 바로 사용
            if (currentLat !== null && currentLon !== null) {
                requestRoutesByCoords(currentLat, currentLon);
                return;
            }

            loading.innerText = '📍 실시간 위치를 파악 중입니다...';

            const onSuccess = (position) => {
                currentLat = position.coords.latitude;
                currentLon = position.coords.longitude;

                const newLocation = new naver.maps.LatLng(currentLat, currentLon);
                map.panTo(newLocation);
                marker.setPosition(newLocation);

                requestRoutesByCoords(currentLat, currentLon);
            };

            const onFail = (error) => {
                loading.style.display = 'none';
                console.log('GPS error', error.code, error.message);
                const msg = {
                    1: '위치 권한이 차단되어 있습니다. 브라우저/기기 설정에서 위치를 허용해주세요.',
                    2: '현재 위치를 확인할 수 없습니다. Wi-Fi/위치 서비스를 확인하거나 수동 선택을 이용해주세요.',
                    3: '위치 확인 시간이 초과되었습니다. 아래 수동 선택을 이용해주세요.'
                }[error.code] || '위치를 가져오지 못했습니다.';
                alert(msg);
            };

            // 1차: 정밀 모드 → 실패(권한 거부 제외)하면 2차: 저정밀 모드로 재시도
            navigator.geolocation.getCurrentPosition(onSuccess, (err) => {
                if (err.code === 1) return onFail(err);
                navigator.geolocation.getCurrentPosition(onSuccess, onFail,
                    { enableHighAccuracy: false, timeout: 20000, maximumAge: 60000 });
            }, { enableHighAccuracy: true, timeout: 8000, maximumAge: 0 });
        }

        // 수동 검색 함수
        function findRoutes() {
            const building = document.getElementById('building-select').value;
            if (!building) {
                alert('건물을 먼저 선택해주세요!');
                return;
            }

            const loading = document.getElementById('loading');
            loading.style.display = 'block';
            loading.innerText = '🚌 버스 도착 시간을 계산하고 있습니다...';
            document.getElementById('result-container').innerHTML = '';

            fetch('/get_route_info', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ location: building })
            })
            .then(response => response.json())
            .then(data => renderResults(data))
            .catch(error => {
                loading.style.display = 'none';
                alert('데이터 통신에 실패했습니다.');
            });
        }

        // 결과 화면 그리기 함수 (중복 제거용)
        function renderResults(data) {
            document.getElementById('loading').style.display = 'none';
            const container = document.getElementById('result-container');
            
            if (data.error) {
                container.innerHTML = `<div class="result-card" style="text-align:center; color:#E53E3E; font-weight:bold;">${data.error}</div>`;
                return;
            }

            let html = '';
            data.forEach(station => {
                html += `
                <div class="result-card">
                    <div class="station-header">
                        <h3 class="station-name">🚏 ${station.station_name}</h3>
                        <span class="walk-time">도보 ${station.walk_min}분 (${station.walk_dist}m)</span>
                    </div>
                    <div class="bus-list">`;
                
                if (station.buses.length > 0) {
                    station.buses.forEach(bus => {
                        html += `
                        <div class="bus-item">
                            <span class="bus-number">${bus.route}번</span>
                            <span class="bus-time">${bus.min_left}분 후</span>
                        </div>`;
                    });
                } else {
                    html += `<div style="text-align: center; color: #A0AEC0; padding: 10px 0; font-weight:600;">도착 예정 버스가 없습니다.</div>`;
                }
                
                html += `</div></div>`;
            });
            container.innerHTML = html;
        }
    </script>
</body>
</html>
