<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>춘천 대학생 통학 마스터</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    <style>
        :root {
            --primary-color: #005AAB; 
            --bg-color: #F5F7FA;
        }
        body {
            font-family: 'Pretendard', sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
            color: #333;
        }
        .container {
            max-width: 480px;
            margin: 0 auto;
            padding: 20px;
        }
        .header {
            text-align: center;
            padding: 30px 0 20px 0;
        }
        .header h1 {
            font-size: 28px;
            font-weight: 800;
            color: var(--primary-color);
            margin: 0;
            letter-spacing: -0.5px;
        }
        .header p {
            font-size: 15px;
            color: #666;
            margin-top: 8px;
        }
        .campus-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
        }
        .campus-tab {
            flex: 1;
            padding: 14px;
            border-radius: 12px;
            border: 2px solid #E2E8F0;
            background: white;
            color: #718096;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }
        .campus-tab.active {
            border-color: var(--primary-color);
            background-color: var(--primary-color);
            color: white;
        }
        .search-box {
            background: white;
            padding: 24px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.03);
            margin-bottom: 20px;
        }
        select {
            width: 100%;
            padding: 16px;
            border: 1.5px solid #E2E8F0;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 500;
            outline: none;
            font-family: inherit;
            margin-bottom: 12px;
            appearance: none; 
            background: url('data:image/svg+xml;utf8,<svg fill="%23999" height="24" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg"><path d="M7 10l5 5 5-5z"/><path d="M0 0h24v24H0z" fill="none"/></svg>') no-repeat right 10px center;
            background-color: white;
        }
        select:focus {
            border-color: var(--primary-color);
        }
        button {
            width: 100%;
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 18px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }
        button:active {
            transform: scale(0.98);
        }
        .result-card {
            background: white;
            padding: 24px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.03);
            margin-bottom: 16px;
        }
        .station-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid #EDF2F7;
        }
        .station-name {
            font-size: 18px;
            font-weight: 800;
            color: #1A202C;
            margin: 0;
        }
        .walk-time {
            font-size: 14px;
            color: #005AAB;
            font-weight: 600;
            white-space: nowrap;
        }
        .bus-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .bus-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .bus-number {
            font-size: 16px;
            font-weight: 800;
            color: #2D3748;
            background: #EDF2F7;
            padding: 6px 12px;
            border-radius: 8px;
        }
        .bus-time {
            color: #E53E3E;
            font-weight: 800;
            font-size: 16px;
        }
        .loading {
            text-align: center;
            display: none;
            padding: 30px;
            color: #718096;
            font-weight: 600;
        }
    </style>
    <script src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=gthv6ddfee"></script>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚌 통학 마스터</h1>
            <p>한림대 · 강원대 실시간 최단 경로 버스 안내</p>
        </div>

        <div class="search-box">
            <!-- 1. 학교 선택 탭 버튼 -->
            <div class="campus-tabs">
                <button id="tab-hallym" class="campus-tab active" onclick="switchCampus('hallym')">🏫 한림대학교</button>
                <button id="tab-knu" class="campus-tab" onclick="switchCampus('knu')">🏫 강원대학교</button>
            </div>

            <!-- 2. 실시간 GPS 검색 버튼 -->
            <button onclick="findRoutesByGPS()" style="background-color: #03c75a; font-size: 18px; margin-bottom: 20px;">
                📍 내 실시간 위치로 주변 버스 찾기
            </button>
            
            <!-- 3. 네이버 지도 -->
            <div id="map" style="width:100%; height:250px; border-radius: 12px; margin-bottom: 20px;"></div>

            <!-- 4. 건물 직접 선택 영역 -->
            <div style="padding-top: 15px; border-top: 1px solid #eee;">
                <p style="font-size: 13px; color: #888; margin-bottom: 8px;">건물 위치로 직접 검색하시겠어요?</p>
                <select id="building-select">
                    <option value="">현재 있는 건물을 선택하세요</option>
                </select>
                <button onclick="findRoutes()" style="background-color: #2D3748;">선택한 건물로 버스 찾기</button>
            </div>
        </div>

        <div id="loading" class="loading">
            실시간 버스 정보를 불러오는 중입니다... 🏃‍♂️
        </div>

        <div id="result-container"></div>
    </div>

    <script>
        // 서버에서 넘어온 학교별 건물 리스트 저장
        const buildingData = {
            hallym: {{ hallym_buildings | tojson }},
            knu: {{ knu_buildings | tojson }}
        };

        const campusCenter = {
            hallym: { lat: 37.8863, lon: 127.7381 },
            knu: { lat: 37.8691, lon: 127.7442 }
        };

        let selectedCampus = 'hallym';
        let currentLat = null;
        let currentLon = null;
        let map;
        let marker;

        window.onload = function() {
            const center = campusCenter.hallym;
            map = new naver.maps.Map('map', {
                center: new naver.maps.LatLng(center.lat, center.lon),
                zoom: 16
            });

            marker = new naver.maps.Marker({
                position: new naver.maps.LatLng(center.lat, center.lon),
                map: map
            });

            // 초기 건물 목록을 한림대로 세팅
            updateBuildingSelect('hallym');
            findMyLocation();
        };

        // 학교 전환 함수 (한림대 <-> 강원대)
        function switchCampus(campus) {
            selectedCampus = campus;
            document.getElementById('tab-hallym').classList.toggle('active', campus === 'hallym');
            document.getElementById('tab-knu').classList.toggle('active', campus === 'knu');

            // 드롭다운 목록 교체
            updateBuildingSelect(campus);

            // 지도 중심 이동
            const center = campusCenter[campus];
            const newLoc = new naver.maps.LatLng(center.lat, center.lon);
            map.panTo(newLoc);
            marker.setPosition(newLoc);
        }

        function updateBuildingSelect(campus) {
            const selectEl = document.getElementById('building-select');
            const schoolName = campus === 'hallym' ? '한림대' : '강원대';
            selectEl.innerHTML = `<option value="">[${schoolName}] 건물을 직접 선택하세요</option>`;
            
            buildingData[campus].forEach(name => {
                const opt = document.createElement('option');
                opt.value = name;
                opt.textContent = name;
                selectEl.appendChild(opt);
            });
        }

        function findMyLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.watchPosition(function(position) {
                    currentLat = position.coords.latitude;
                    currentLon = position.coords.longitude;
                }, function(error) {
                    console.log("GPS 대기 중");
                }, { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 });
            }
        }

        function findRoutesByGPS() {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('loading').innerText = '📍 실시간 위치를 파악 중입니다 (최대 10초 소요)...';
            document.getElementById('result-container').innerHTML = '';

            navigator.geolocation.getCurrentPosition(
                function(position) {
                    currentLat = position.coords.latitude;
                    currentLon = position.coords.longitude;
                    
                    const newLocation = new naver.maps.LatLng(currentLat, currentLon);
                    map.panTo(newLocation);
                    marker.setPosition(newLocation);

                    document.getElementById('loading').innerText = '🚌 버스 도착 시간을 계산하고 있습니다...';
                    
                    fetch('/get_route_info', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ lat: currentLat, lon: currentLon })
                    })
                    .then(response => response.json())
                    .then(data => renderResults(data))
                    .catch(error => {
                        document.getElementById('loading').style.display = 'none';
                        alert('데이터 통신에 실패했습니다.');
                    });
                },
                function(error) {
                    document.getElementById('loading').style.display = 'none';
                    alert("GPS 신호가 약합니다. 아래의 '건물 직접 선택'을 이용해주세요.");
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        }

        function findRoutes() {
            const building = document.getElementById('building-select').value;
            if (!building) {
                alert('건물을 먼저 선택해주세요!');
                return;
            }

            document.getElementById('loading').style.display = 'block';
            document.getElementById('loading').innerText = '🚌 선택한 건물 주변 버스를 찾고 있습니다...';
            document.getElementById('result-container').innerHTML = '';

            fetch('/get_route_info', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ location: building, campus: selectedCampus })
            })
            .then(response => response.json())
            .then(data => {
                if (data.length > 0 && data[0].target_lat) {
                    const bLoc = new naver.maps.LatLng(data[0].target_lat, data[0].target_lon);
                    map.panTo(bLoc);
                    marker.setPosition(bLoc);
                }
                renderResults(data);
            })
            .catch(error => {
                document.getElementById('loading').style.display = 'none';
                alert('데이터 통신에 실패했습니다.');
            });
        }

        function renderResults(data) {
            document.getElementById('loading').style.display = 'none';
            const container = document.getElementById('result-container');
            
            if(data.error) {
                container.innerHTML = `<div class="result-card" style="text-align:center; color:#E53E3E; font-weight:bold;">${data.error}</div>`;
                return;
            }

            let html = '';
            data.forEach(station => {
                const sttnNoText = station.station_no ? `(${station.station_no})` : '';
                
                html += `
                <div class="result-card">
                    <div class="station-header">
                        <div>
                            <h3 class="station-name">🚏 ${station.station_name} <span style="font-size:14px; color:#718096; font-weight:500;">${sttnNoText}</span></h3>
                            <div style="font-size: 13px; color: #03c75a; font-weight: 700; margin-top: 4px;">
                                ➡️ ${station.direction}
                            </div>
                        </div>
                        <span class="walk-time">도보 ${station.walk_min}분 (${station.walk_dist}m)</span>
                    </div>
                    <div class="bus-list">`;
                
                if (station.buses.length > 0) {
                    station.buses.forEach(bus => {
                        html += `
                        <div class="bus-item">
                            <div>
                                <span class="bus-number">${bus.route}번</span>
                                <span style="font-size: 14px; color: #4A5568; font-weight: 600; margin-left: 6px;">${bus.destination}</span>
                            </div>
                            <div style="text-align: right;">
                                <span class="bus-time">${bus.min_left}분 후</span>
                                <span style="font-size: 12px; color: #A0AEC0; display: block;">(${bus.prev_cnt}정류장 전)</span>
                            </div>
                        </div>`;
                    });
                } else {
                    html += `<div style="text-align: center; color: #A0AEC0; padding: 10px 0; font-weight:600;">도착 예정 버스가 없습니다.</div>`;
                }
                
                html += `</div></div>`;
            });
            container.innerHTML = html;
        }
    </script>
</body>
</html>
